name: update bucket

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.up.outputs.ver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: up
        run: echo "ver=$(./update.sh)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.up.outputs.ver != 'unchanged'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket
          git commit -m "feat: update ${{ steps.up.outputs.ver }}"
          git push

  # Install the new manifests on Windows to prove they work.
  test:
    needs: update
    if: needs.update.outputs.ver != 'unchanged'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
