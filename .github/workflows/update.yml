name: update bucket

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: up
        run: echo "ver=$(./update.sh)" >> "$GITHUB_OUTPUT"
      - if: steps.up.outputs.ver != 'unchanged'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "feat: update yonder to ${{ steps.up.outputs.ver }}"
          git push
